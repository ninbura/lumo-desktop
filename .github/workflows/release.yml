# Unofficial arm64 (aarch64) Linux builds of Proton's Lumo Desktop.
#
# Proton's pushes can't trigger workflows in a fork, so this checks hourly.
# It builds only what Proton has released: the version in Proton's release
# manifest (version.json) must match package.json on ProtonLumo/lumo-desktop's
# master. That commit is built unchanged on GitHub's arm64 runner, published as
# a release tagged at that exact upstream commit, with a signed build
# provenance attestation for every file.
name: Build arm64 release

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this upstream commit already has a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UPSTREAM: ProtonLumo/lumo-desktop
  # Proton's release manifest for Linux: the current stable version.
  MANIFEST: https://proton.me/download/lumo/desktop/linux/v1/version.json
  # Without this the app loads https://lumo.proton.dev (Proton's internal dev
  # site, src-tauri/src/lib.rs) and shows "Unacceptable TLS certificate".
  LUMO_URL: https://lumo.proton.me

jobs:
  mirror:
    name: Mirror upstream master
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Force master to match ProtonLumo/lumo-desktop
        run: |
          git init -q mirror && cd mirror
          git fetch -q "https://github.com/$UPSTREAM.git" master
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" FETCH_HEAD:refs/heads/master

  check:
    name: Check for a new Proton release
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: check
        run: |
          skip() { echo "$1"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; }

          released=$(curl -fsSL "$MANIFEST" | jq -r '[.Releases[] | select(.CategoryName == "Stable")][0].Version')
          sha=$(gh api "repos/$UPSTREAM/commits/master" --jq .sha)
          version=$(gh api "repos/$UPSTREAM/contents/package.json?ref=$sha" --jq .content | base64 -d | jq -r .version)
          echo "Proton's stable release: $released"
          echo "Upstream master: $sha (package.json $version)"

          # Only build what Proton has released: not unreleased work on master,
          # and not before the matching source reaches GitHub.
          [[ $version == "$released" ]] || skip "master is $version, Proton's release is $released; waiting until they match."

          # Tags here point at the upstream commit they were built from.
          tag=""
          while read -r tsha ref; do
            [[ $tsha == "$sha" ]] || continue
            t=${ref#refs/tags/}
            if gh release view "$t" >/dev/null 2>&1 && [[ "${{ inputs.force }}" != "true" ]]; then
              skip "Release $t already exists for $sha; nothing to do."
            fi
            tag=$t
          done < <(git ls-remote --tags "https://github.com/$GH_REPO.git")

          if [[ -z $tag ]]; then
            tag="v$version"
            # Same version, different commit: keep both, tell them apart by commit.
            if git ls-remote --exit-code --tags "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null; then
              tag="v$version-${sha:0:7}"
            fi
          fi
          echo "Will build $tag from $sha"
          {
            echo "build=true"
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and release
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write      # tag and release
      id-token: write      # sign the provenance attestation
      attestations: write  # store it
    env:
      SHA: ${{ needs.check.outputs.sha }}
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # linuxdeploy can't use FUSE on the runner, and its bundled strip
      # predates the toolchain's object format.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      # Third-party actions are pinned to exact commits (tag in the comment).
      - name: Check out upstream source (unmodified)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ProtonLumo/lumo-desktop
          ref: ${{ needs.check.outputs.sha }}
          path: src
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential pkg-config file patchelf xdg-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libsoup-3.0-dev

      - name: Install JS dependencies
        working-directory: src
        run: npm ci --no-audit --no-fund

      - name: Sync the app's own version in Cargo.lock
        working-directory: src/src-tauri
        run: |
          # Upstream's Cargo.lock can lag the app's own version (0.5.8 in the
          # 0.5.9 commit). --workspace rewrites only that entry; this fails the
          # build if any dependency moved.
          cargo update --workspace
          changed=$(git diff --numstat Cargo.lock)
          echo "Cargo.lock changes: ${changed:-none}"
          if [[ -n $changed && $changed != $'1\t1\tsrc-tauri/Cargo.lock' ]]; then
            git diff Cargo.lock
            echo "::error::cargo update --workspace changed dependencies, not just the app's version"
            exit 1
          fi

      - name: Build
        working-directory: src
        run: npm run build -- --bundles deb,rpm,appimage

      - name: Verify the binary
        working-directory: src/src-tauri/target/release
        run: |
          file lumo-desktop
          file lumo-desktop | grep -q 'ARM aarch64'
          grep -q "$LUMO_URL" lumo-desktop || { echo "::error::LUMO_URL is not in the binary"; exit 1; }

      - name: Collect release files
        run: |
          mkdir out
          b=src/src-tauri/target/release/bundle
          cp $b/deb/*.deb $b/rpm/*.rpm $b/appimage/*.AppImage out/
          # Plain archive of the installed file tree (same files as the .deb),
          # for distros that package it themselves, e.g. an Arch PKGBUILD.
          tar -C $b/deb/*/data -czf "out/lumo-desktop-$VERSION-aarch64.tar.gz" usr
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*

      - name: Write release notes
        run: |
          # This version's section of Proton's changelog.md, without its heading.
          changes=$(awk -v v="## [$VERSION]" '$0 == v {on=1; next} on && /^## \[/ {exit} on' src/changelog.md \
                    | sed -e 's/^###/####/')
          cat > notes.md <<EOF
          **Unofficial** arm64 (aarch64) Linux build of [Lumo Desktop](https://github.com/$UPSTREAM) $VERSION. Not made, signed or supported by Proton.

          Built from upstream commit [\`${SHA:0:7}\`](https://github.com/$UPSTREAM/commit/$SHA), the source of Proton's $VERSION release, with no changes to Proton's code, by [this workflow](https://github.com/$GH_REPO/blob/arm64-builds/.github/workflows/release.yml) ([run](https://github.com/$GH_REPO/actions/runs/${{ github.run_id }})). The only build setting is \`LUMO_URL=$LUMO_URL\`, as in Proton's own releases.

          ### Verify a download
          Every file has a signed build provenance attestation (built by this workflow, from this commit):
          \`\`\`
          gh attestation verify <file> -R $GH_REPO
          \`\`\`
          Or compare against \`SHA256SUMS\`.

          ### Files
          | File | For |
          |---|---|
          | \`.deb\` | Debian, Ubuntu 24.04+ |
          | \`.rpm\` | Fedora 40+ |
          | \`.AppImage\` | other distros (needs WebKitGTK 4.1 installed) |
          | \`.tar.gz\` | packaging it yourself (the \`/usr\` tree from the \`.deb\`) |

          - Install it with your package manager, not by running the bare binary: browser sign-in comes back through \`proton-lumo://\` links, which only an installed desktop entry handles.
          - The in-app updater does nothing on arm64 Linux (Proton publishes no arm64 update). Update by installing the next release.
          - Crash reports don't go to Proton (their reporting key isn't in the public source).

          ### What's new in $VERSION (from Proton's changelog)
          ${changes:-See [Proton's changelog](https://github.com/$UPSTREAM/blob/$SHA/changelog.md).}
          EOF
          cat notes.md

      - name: Tag the upstream commit and publish the release
        run: |
          git -C src push "https://x-access-token:${{ github.token }}@github.com/$GH_REPO.git" "$SHA:refs/tags/$TAG" -f
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Forced rebuild of a commit that already has a release: replace its files and notes.
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "Lumo $VERSION (unofficial arm64)" --notes-file notes.md
          else
            gh release create "$TAG" out/* \
              --verify-tag \
              --title "Lumo $VERSION (unofficial arm64)" \
              --notes-file notes.md
          fi
