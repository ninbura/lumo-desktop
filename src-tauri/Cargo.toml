[package]
name = "lumo"
version = "0.5.10"
edition = "2021"
description = "Lumo desktop app for macOS, Windows and Linux"
authors = ["Eamonn Maguire"]
license = "GPL-3.0-only"
default-run = "lumo-desktop"

[lib]
name = "lumo_lib"

[[bin]]
name = "lumo-desktop"
path = "src/main.rs"

[[bin]]
name = "test-mcp-server"
path = "src/bin/test_mcp_server.rs"
required-features = ["test-utils"]

[build-dependencies]
tauri-build = { version = "^2.6.3", features = [] }

[dependencies]
semver = "1"
tauri = { version = "^2.12.7", features = ["tray-icon", "macos-private-api", "unstable", "image-png"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "io-util", "process", "net", "time"] }
anyhow = "1.0.96"
async-trait = "0.1.88"
thiserror = "2.0.12"
walkdir = "2.5.0"
glob = "0.3.2"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
base64 = "0.22.1"
sha2 = "0.10.9"
open = "5.3.2"
url = "2.5.4"
rmcp = { version = "=3.5.1", features = ["client", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "auth", "reqwest"] }
# The spawner rmcp already uses; named here so its Windows job-object wrapper is reachable.
process-wrap = { version = "10.0", features = ["tokio1"] }
scraper = "0.22"
rand = "0.9.5"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
mail-parser = "0.11.5"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
log = "0.4.28"
croner = "4.0.1"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "debug-images", "panic", "reqwest", "rustls"] }
tauri-plugin-autostart = "^2.5.1"
tauri-plugin-deep-link = "^2"
tauri-plugin-dialog = "^2.4.0"
tauri-plugin-global-shortcut = "^2.3.0"
tauri-plugin-log = "^2.7.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "^2", features = ["deep-link"] }
tauri-plugin-updater = "^2.10.1"
# Only compiled in with the `e2e-webdriver` feature.
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
tauri-plugin-wdio = { version = "=1.5.1", optional = true }

[features]
test-utils = []
# Explicit opt-in: automation is absent from ordinary application builds.
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio", "tauri/dynamic-acl"]

[lints.rust]
# objc 0.2's macros check a `cargo-clippy` feature that current rustc does not know.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[target.'cfg(not(windows))'.dependencies]
keyring = { version = "3.6.2", features = ["apple-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
libc = "0.2"
block = "0.1"
cocoa = "0.25"
mac-usernotifications = "0.3.1"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
notify-rust = "4.18.2"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
# Must match wry's versions so the COM types are compatible with `with_webview`.
webview2-com = "0.39"
windows-core = "0.62"
# Pinned to the version process-wrap already pulls in, so the build keeps one copy.
windows = { version = "0.62.2", features = ["UI_Notifications", "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.18.0"
tokio = { version = "1.43.0", features = ["test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
